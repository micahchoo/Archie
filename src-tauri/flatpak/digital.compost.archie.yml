# Flatpak manifest for Archie Studio (Tauri desktop shell).
# Packages the self-contained Tauri release binary (frontend embedded by `tauri::generate_context!`)
# against the GNOME 49 runtime, which provides webkit2gtk-4.1 + GTK3 + libsoup3 (the wry/Tauri
# Linux dependency set). See docs/plans/tauri-port.md.
#
# Build:  flatpak run org.flatpak.Builder --user --install --force-clean build-dir \
#           src-tauri/flatpak/digital.compost.archie.yml
# Run:    flatpak run digital.compost.archie
id: digital.compost.archie

runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk

command: archie

# ── VIDEO CODECS (Archie-7e6f) — why there is NO `add-extensions` block here ─────────────────────
# The web-tier video transcode (src-tauri/src/video.rs) shells out to the runtime's `ffmpeg`, and
# H.264 — the default target, and the format most authored video already IS — is not in the base
# runtime. The ticket's decision was to make H.264 work on a stock install. Measured on 2026-07-27,
# that needs no manifest stanza at all, and adding one would be cargo cult. The evidence, so the next
# reader can re-run it rather than trust it:
#
# 1. THE RUNTIME ALREADY DECLARES THE EXTENSION POINT. `flatpak info --show-metadata
#    org.gnome.Platform//49` contains, verbatim:
#
#        [Extension org.freedesktop.Platform.codecs-extra]
#        directory = lib/x86_64-linux-gnu/codecs-extra
#        version = 25.08-extra
#        add-ld-path = lib
#        autodelete = true
#
#    There is no `no-autodownload`, so the extension installs with the runtime. An `add-extensions`
#    block in THIS file would declare a different, app-scoped point rooted at `/app/…`, which is the
#    mechanism for an app's OWN plugin directory — it would not and could not supply the runtime's
#    ffmpeg with anything.
#
# 2. THE EXTENSION IS A REPLACEMENT ffmpeg STACK, NOT JUST GSTREAMER PLUGINS — this is the part worth
#    knowing, because "an ld path can't change what a binary already linked" is the obvious objection
#    and it is wrong here. The extension ships its own `libavcodec.so.61.19.101`, `libavformat.so.61`,
#    `libavutil.so.59`, `libsw{scale,resample}`, `libpostproc`, plus `libx264.so.165` /
#    `libx265.so.216`. `objdump -p` on the extension's libavcodec lists `NEEDED libx264.so.165` and
#    `NEEDED libx265.so.216`; the BASE runtime's libavcodec lists neither. `add-ld-path = lib` puts
#    `/usr/lib/x86_64-linux-gnu/codecs-extra/lib` on LD_LIBRARY_PATH, so the runtime's
#    `/usr/bin/ffmpeg` resolves `libavcodec.so.61` to the extension's copy and gains H.264 in BOTH
#    directions. Decode is the half that actually bites: the base build carries
#    `--disable-decoder='h264,hevc,vc1,vvc'`, so without the extension the sidecar cannot even READ
#    typical authored video, whatever it writes.
#
# 3. GNOME 49 sits on freedesktop 25.08 (`org.freedesktop.Platform` installs as `freedesktop-sdk-
#    25.08.14`, branch `25.08`), which is why the version above reads `25.08-extra`. If this manifest
#    is ever bumped to a newer GNOME runtime, re-read that stanza — the extension's branch moves with
#    the freedesktop base, not with GNOME's number.
#
# NOT VERIFIED HERE, and deliberately not claimed: no Flatpak was built or run for this change. The
# above is read from the installed runtime's metadata and the extension's own ELF headers. A packaged
# run is still the outstanding check on Archie-7e6f, together with `video_probe_encoders` reporting
# `h264: true` inside the sandbox. `video_probe_encoders` never throws, so a machine that somehow
# lacks the extension greys the control with a reason rather than failing mid-publish.

finish-args:
  - --socket=wayland # show the window under Wayland
  - --socket=fallback-x11 # …or X11
  - --socket=pulseaudio # audio in/out for AV notes (wavesurfer playback) — without it there is no sound device
  - --device=dri # GPU acceleration for the deep-zoom canvas
  - --share=ipc # required with X11
  - --share=network # remote-hosted templates (e.g. Bidar) + future sharing; local-first otherwise
  - --filesystem=home # user-picked Project folders + "Save .archie.zip" land in the real home dir
  # "Stay signed in" (github.rs Q-12): keyring's sync-secret-service feature talks to the host
  # keyring daemon at org.freedesktop.secrets on the session bus. Without this talk-name the
  # sandbox silently gets NO_REPLY/access-denied, save_token() returns false, and the session
  # token is dropped on every relaunch.
  - --talk-name=org.freedesktop.secrets
  # NOT needed: a talk-name for tauri-plugin-opener. Archie grants only opener:allow-open-url
  # (capabilities/default.json) and openUrl() runs the `open` crate → xdg-open, which in the
  # GNOME runtime is the flatpak-xdg-utils shim calling the OpenURI portal on
  # org.freedesktop.portal.Desktop — a bus name Flatpak permits by default. (revealItemInDir
  # would need --talk-name=org.freedesktop.FileManager1, but it is neither permitted nor called.)
  # - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1 # uncomment if the webview renders black on Wayland

modules:
  - name: archie
    buildsystem: simple
    build-commands:
      - install -Dm755 archie /app/bin/archie
      - install -Dm644 digital.compost.archie.desktop /app/share/applications/digital.compost.archie.desktop
      - install -Dm644 digital.compost.archie.metainfo.xml /app/share/metainfo/digital.compost.archie.metainfo.xml
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/digital.compost.archie.png
      - install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/digital.compost.archie.png
    sources:
      - type: file
        path: ../target/release/archie
      - type: file
        path: digital.compost.archie.desktop
      - type: file
        path: digital.compost.archie.metainfo.xml
      - type: file
        path: ../icons/128x128.png
      - type: file
        path: ../icons/128x128@2x.png
