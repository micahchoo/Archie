[package]
name = "archie"
version = "1.0.0"
description = "Archie Studio — desktop shell"
authors = ["Archie"]
edition = "2021"
license = "GPL-3.0-only"

# The Rust crate that hosts the webview. Logic-light by design: all app behaviour lives in the
# Studio web bundle; Rust only registers the fs + dialog plugins the TauriFsBridge calls into.

[lib]
name = "archie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# Hands the device-code URL off to the system browser (the "Open GitHub to enter it" button).
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHub device-flow handshake (github.rs). rustls keeps the REST/token traffic off openssl; reuses the
# reqwest 0.12 already in the tree via tauri-plugin-http.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
# `tokio::time::sleep` for the poll back-off loop; tokio is already in-tree via tauri.
tokio = { version = "1", features = ["time"] }
# OS keyring for "stay signed in" token custody (Q-12). sync-secret-service is the persistent Linux
# store (GNOME Keyring / KWallet over pure-Rust zbus — no system lib); crypto-rust keeps it openssl-free.
# The keyring platform-store selection for the Flatpak Secret portal is finalized in the packaging pass
# (plan Open Q-E4); tests override this with the built-in mock store.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Single-pack deploy upload — stage the site tree, commit, force-push to gh-pages (Q-13, gh_push_tree).
# Plain git2 (no vendored-openssl) validated by docs/spikes/2026-07-git2-in-tauri.md: libgit2 is
# statically vendored (good for Flatpak); it links the system OpenSSL for TLS. Keep vendored-openssl in
# reserve for a build host without libssl-dev (see the spike). libssh2/SSH unused — we push over HTTPS.
# NB the spike validated this at git2 0.19 / vendored libgit2 1.8.1; 0.20.4 vendors 1.9.x, so the
# system-libssl link must be re-checked against the GNOME 49 runtime in the packaging pass.
# 0.20.4 clears GHSA/RUSTSEC alert #53 (UB dereferencing git2::Buf — a null guard added to
# Deref/DerefMut in src/buf.rs; this crate never constructs a Buf, so the alert is package-level
# reachable but API-level unreachable). Do NOT use a bare "0.21": its default features are [] where
# 0.20.4 has [ssh, https], so the identical code compiles clean but vendors libgit2 with no TLS and
# push dies at runtime with klass 16 "there is no TLS stream available". If 0.21 is ever taken it
# must be { version = "0.21", features = ["https"] }. See ledgers/DEPS-dependabot-2026-07-20.md §3b.
git2 = "0.20.4"

[dev-dependencies]
# Temp dirs for the stage-and-commit tests (gh_push_tree).
tempfile = "3"
