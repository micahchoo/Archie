[package]
name = "archie"
version = "1.0.0"
description = "Archie Studio — desktop shell"
authors = ["Archie"]
edition = "2021"
license = "GPL-3.0-only"

# The Rust crate that hosts the webview. Logic-light by design: all app behaviour lives in the
# Studio web bundle; Rust only registers the fs + dialog plugins the TauriFsBridge calls into.

[lib]
name = "archie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHub device-flow handshake (github.rs). rustls-only to avoid an openssl link (the git2 spike owns
# that question separately); reuses the reqwest 0.12 already in the tree via tauri-plugin-http.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
# `tokio::time::sleep` for the poll back-off loop; tokio is already in-tree via tauri.
tokio = { version = "1", features = ["time"] }
