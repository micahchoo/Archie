<!doctype html>
<!--
  Recipe 09 — Resize an iframe from its content height

  The parent listener matches each height message to its iframe window.
  Gallery and exhibit grids can change the iframe height.
  The reader keeps the current height to avoid a resize loop.
  Automatic height changes require scripts on the parent page.
  For a parent that cannot run scripts, use a fixed iframe height.
  This recipe loads root dist/ and the generated sample tree from the same server.
  Sample covers and media can still request external servers.
  See README.md for the generation, build, sync, and local server procedure.
  Open http://localhost:8000/recipes/09-autogrow.html.
  See EMBED.md for the iframe reference.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>archie-viewer — iframe auto-grow demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #efe7df; color: #2a2320; }
    .wrap { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-weight: 300; }
    p { color: #6b5d52; line-height: 1.5; }
    /* NO fixed height on the iframe — the listener sets it from the embed's posted content height.
       A min-height avoids a 0px flash before the first message arrives. */
    iframe { width: 100%; min-height: 320px; border: 1px solid #c9a98f; border-radius: 8px; background: #fff; }
    code { background: #e7ded7; padding: 0 .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>iframe auto-grow</h1>
    <p>The iframe below has <strong>no fixed height</strong>. The embedded <code>&lt;archie-viewer&gt;</code>
       posts its content height and the page resizes the iframe to match — click a card, open an object,
       come back, and watch the frame follow the content.</p>
    <!-- The inner page (srcdoc) hosts the element at its NATURAL height (no height style), so it grows with
         content. srcdoc's base URL is this page's, so /dist and /apps resolve from the server root. -->
    <iframe
      id="embed"
      title="Archie viewer (auto-grow)"
      loading="lazy"
      srcdoc="<script type='module' src='/dist/archie-viewer.js'></script><archie-viewer src='/apps/viewer/public/published/' style='display:block'></archie-viewer>"></iframe>
  </div>

  <!-- ── THE AUTO-GROW LISTENER — copy this into your host page. ─────────────────────────────────── -->
  <script>
    // Resize each <archie-viewer> iframe to the height it posts (DIVERGENCES §5 / anvil ADR-0006 F1).
    // Matches the sender iframe by event.source, so several embeds on one page each size independently.
    addEventListener("message", (e) => {
      if (e.data?.type !== "archie-embed:height") return;
      const h = Number(e.data.height);
      if (!Number.isFinite(h) || h < 0 || h > 16000) return; // ignore a hostile/buggy height — never blow up the page
      for (const f of document.querySelectorAll("iframe")) {
        if (f.contentWindow === e.source) { f.style.height = h + "px"; break; }
      }
    });
  </script>
</body>
</html>
