<!doctype html>
<!--
  Recipe 03 — Local file picker and drop screen

  Without src, the element lets the visitor choose or drop a .archie.zip.
  The library opens from the file without a library download.
  The loader checks the Archie format marker and archive size limits.
  The CDN runtime still needs network access. External media can also require network requests.
  For disconnected use, serve the runtime locally and use a library with bundled media.
  See EMBED.md#offline for the current offline policy.
  This example uses the pinned v1.1 CDN bundle.
  See README.md for the current local build and server procedure.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — open your own library</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    archie-viewer { display: block; width: 100%; height: 80vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #ddd; }
    p.hint { padding: 0 1.25rem; color: #555; }
  </style>

  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>
  <header><h1>Open a library</h1></header>
  <p class="hint">Drop an <code>.archie.zip</code> file onto the viewer below.</p>

  <!--
    No src attribute at all -> the drop screen. This is the whole recipe.
  -->
  <archie-viewer></archie-viewer>
</body>
</html>
