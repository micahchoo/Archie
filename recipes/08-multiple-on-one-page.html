<!doctype html>
<!--
  Recipe 08 — Two embeds on one page

  Load the runtime once, then add an element for each library or target.
  The current element owns its library and navigation state per instance.
  Iframes are an alternative for hosts that permit frames but remove custom elements or scripts.
  Replace the sample source URLs, exhibit slugs, and iframe wrapper URLs before reuse.
  This example uses the pinned v1.1 CDN bundle.
  See EMBED.md for the reference and README.md for the current local build.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — two on one page</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; }
    archie-viewer, iframe { display: block; width: 100%; height: 70vh; border: 0; }
    h2 { margin: 0 0 .25rem; }
    .note { padding: 0 1rem; color: #8a5300; background: #fff8e6; }
  </style>

  <!-- Runtime loaded ONCE for the whole page. -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>

  <!-- Two elements share the runtime and have separate source and target attributes. -->
  <p class="note">
    The two elements use one runtime. Each has its own target.
    The iframe examples need hosted wrapper pages at the placeholder URLs.
  </p>

  <!-- replace with your own published-tree base URL if you fork -->
  <div class="grid">
    <section>
      <h2>Voynich</h2>
      <archie-viewer
        src="https://micahchoo.github.io/Archie/viewer/published/"
        target="#/voynich"></archie-viewer>
    </section>
    <section>
      <h2>Language Atlas</h2>
      <archie-viewer
        src="https://micahchoo.github.io/Archie/viewer/published/"
        target="#/language-atlas"></archie-viewer>
    </section>
  </div>

  <hr>

  <!-- Alternative: host a wrapper page for each iframe. See EMBED.md for iframe requirements. -->
  <div class="grid">
    <section>
      <h2>Voynich (iframe)</h2>
      <iframe src="https://yourmuseum.org/embed-voynich.html"
              loading="lazy" title="Voynich — Archie viewer"></iframe>
    </section>
    <section>
      <h2>Language Atlas (iframe)</h2>
      <iframe src="https://yourmuseum.org/embed-language-atlas.html"
              loading="lazy" title="Language Atlas — Archie viewer"></iframe>
    </section>
  </div>

</body>
</html>
