<!doctype html>
<!--
  Recipe 04 — Open an object or note through target

  Copy the route hash beginning with #/ from a Viewer link into target.
  The object example is active. The note example remains commented out.
  Replace the sample source URL, exhibit slug, object ID, and note logical ID before reuse.
  The n3 note ID is a placeholder.
  In the current build, missing objects, notes, and sections open the exhibit grid.
  A missing exhibit opens the gallery. Source or media failures can still show an error.
  This example uses the pinned v1.1 CDN bundle.
  See EMBED.md#targets for current behavior and README.md for the local build.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — deep links</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    section { padding: 1rem 1.25rem; }
    archie-viewer { display: block; width: 100%; height: 70vh; margin-top: .5rem; }
    h2 { margin: 0; } code { background: #f3f3f3; padding: .1em .35em; border-radius: 3px; }
  </style>

  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>

  <!-- EXAMPLE A: open straight to a specific OBJECT (a whole item in the exhibit).
       target = #/{slug}/o/{objectId}. This is the PRIMARY working deep-link — an object id
       resolves directly against the published tree. -->
  <section>
    <h2>A — Land on an object</h2>
    <p>target = <code>#/voynich/o/o1</code></p>
    <!-- replace with your own published-tree base URL if you fork -->
    <archie-viewer
      src="https://micahchoo.github.io/Archie/viewer/published/"
      target="#/voynich/o/o1"></archie-viewer>
  </section>

  <!-- EXAMPLE B: open straight to a specific NOTE.
       target = #/{slug}/a/{logicalId}. Append ?xywh=x,y,w,h to also frame a sub-region.

       The n3 value is a placeholder. Replace it with a published note identifier.
       In the current build, an unmatched note opens the exhibit grid. Uncomment to try:

  <section>
    <h2>B — Land on a note</h2>
    <p>target = <code>#/voynich/a/n3</code></p>
    <archie-viewer
      src="https://micahchoo.github.io/Archie/viewer/published/"
      target="#/voynich/a/n3"></archie-viewer>
  </section>
  -->

</body>
</html>
