<!doctype html>
<!--
  Recipe 02 — Embed a hosted .archie.zip

  Export a .archie.zip from Studio and upload it to static hosting.
  Set src to its URL. The loader checks the Archie format marker.
  External media references still need their origin unless the archive includes those assets.
  For a cross-origin read, the archive server must permit the page origin through CORS.
  Use HTTPS for public deployment. An HTTPS page can block HTTP resources as mixed content.
  Replace yourmuseum.org and codex.archie.zip with your hosting and archive name.
  This example uses the pinned v1.1 CDN bundle.
  See EMBED.md for the reference and README.md for the current local build.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — self-hosted .archie.zip</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    archie-viewer { display: block; width: 100%; height: 80vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #ddd; }
  </style>

  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>
  <header><h1>The Codex</h1></header>

  <!--
    src = the absolute URL of the hosted zip. The server at yourmuseum.org must send
    `Access-Control-Allow-Origin: *` (or your page's origin) for this cross-origin fetch.
  -->
  <archie-viewer
    src="https://yourmuseum.org/libraries/codex.archie.zip"></archie-viewer>
</body>
</html>
