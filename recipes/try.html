<!doctype html>
<!--
  Local page for the current archie-viewer build

  This page loads /dist/archie-viewer.js and /apps/viewer/public/published/ from the repository server.
  The runtime and library use the same origin. External covers and media can still require network access.
  See README.md for the generation, build, sync, and local server procedure.
  Open http://localhost:8000/recipes/try.html.
  Run node recipes/smoke.mjs after the build and sync steps for browser checks.
  See TESTING.md for the manual walkthrough and EMBED.md for the reference.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>archie-viewer — local try</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .note { padding: .6rem 1rem; background: #f6efe9; color: #6b5d52; font-size: .9rem; }
  </style>

  <!-- The local same-origin bundle. It auto-registers the <archie-viewer> element
       and lazily imports ./reader-*.js (the deep-zoom mount) when an object opens.
       The ./chunk-*.js / ./reader-*.js refs resolve relative to /dist/, so an
       entry module must stay beside its imported chunks. -->
  <script type="module" src="/dist/archie-viewer.js"></script>
</head>

<body>
  <p class="note">Local same-origin: bundle = <code>/dist/archie-viewer.js</code>,
     library = the baked tree at <code>/apps/viewer/public/published/</code>.</p>

  <!-- LIVE: load the published tree base. A trailing slash matters — the loader
       treats a non-.zip src as a published-TREE BASE and fetches exhibits.json. -->
  <archie-viewer
    src="/apps/viewer/public/published/"
    style="display:block;height:90vh"></archie-viewer>


  <!-- ============================================================================
       COMMENTED-OUT VARIANTS — swap one in for the live element above to try it.
       ============================================================================ -->

  <!-- (a) NOTE TARGET — current generated fixture.
       The voynich manifest includes archie:logicalId 0000000001SEBWXFTSHHP00TVY for a note on o1.
       In the current build, this target opens the note. An unmatched note opens the exhibit grid.
       Replace the live element with one of these commented examples:

  <archie-viewer
    src="/apps/viewer/public/published/"
    target="#/voynich/a/0000000001SEBWXFTSHHP00TVY"
    style="display:block;height:90vh"></archie-viewer>

       Object target:
  <archie-viewer
    src="/apps/viewer/public/published/"
    target="#/voynich/o/o1"
    style="display:block;height:90vh"></archie-viewer>
  -->

  <!-- (b) OFFLINE URL-LOAD CHECK — expected refusal in the current build.
       This variant blocks the relative src URL and shows a library-load error.
       For offline reading, remove src and choose an archive with bundled media.
       See EMBED.md#offline. -->
  <!--
  <archie-viewer
    src="/apps/viewer/public/published/"
    offline
    style="display:block;height:90vh"></archie-viewer>
  -->

  <!-- (c) NO-SRC drop screen — omit src entirely → the "Open a library" drop/pick zone.
       Drop a .archie.zip onto it, or click "Open a library…". -->
  <!--
  <archie-viewer style="display:block;height:90vh"></archie-viewer>
  -->

  <!-- (d) PRODUCTION script line — the published jsDelivr bundle (replace the local
       <script> in <head> with this for a CDN-hosted embed):
  <script type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"></script>
  -->

</body>
</html>
