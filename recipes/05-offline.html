<!doctype html>
<!--
  Recipe 05 — Local archive with offline enabled

  Without src, the visitor chooses or drops a .archie.zip that includes its media.
  The offline attribute restricts resources within the element.
  In the current build, it permits only blob: and data: resources.
  It also blocks HTTP and relative URL library loads, including a locally served tree.
  The surrounding page and runtime have separate network requirements.
  This example uses the pinned v1.1 CDN bundle, so it still requests runtime files from the CDN.
  See EMBED.md#offline for current behavior and local runtime instructions.
  Presence enables the boolean attribute, including offline="false".
  To disable it, remove the attribute.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — offline kiosk</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    archie-viewer { display: block; width: 100%; height: 80vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #ddd; }
    p.hint { padding: 0 1.25rem; color: #555; }
  </style>

  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>
  <header><h1>Kiosk — offline</h1></header>
  <p class="hint">Drop a <code>.archie.zip</code> that includes its media. This page loads its runtime from the CDN.</p>

  <!--
    No src: the visitor opens a local archive.
    The offline policy controls element resources, not requests from the page or module loader.
  -->
  <archie-viewer offline></archie-viewer>
</body>
</html>
