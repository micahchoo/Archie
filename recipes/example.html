<!doctype html>
<!--
  Archie viewer — complete embed page

  This page opens a hosted library at an object target.
  Replace the source URL, exhibit slug, and object ID before reuse.
  The script uses the pinned v1.1 CDN bundle.
  See EMBED.md for the current attributes, target routes, offline policy, and release distinction.
  See README.md for a current local build.
  The commented iiif-content value is a placeholder, not a usable Content State.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — example</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    archie-viewer { display: block; width: 100%; height: 100%; }
  </style>

  <!-- 1. Load the runtime once, from jsDelivr serving the pinned v1.1 git tag. -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>

  <!-- 2. Open the sample library at object o1. Replace the source and target for your library. -->
  <!-- replace with your own published-tree base URL if you fork -->
  <archie-viewer
    src="https://micahchoo.github.io/Archie/viewer/published/"
    target="#/voynich/o/o1"></archie-viewer>

  <!-- IIIF Content State variant: replace the placeholder with a valid encoded Content State.
       Then uncomment this element instead of the target example. See EMBED.md for precedence.

  <archie-viewer
    src="https://micahchoo.github.io/Archie/viewer/published/"
    iiif-content="JTdCJTIyJTQwY29udGV4dCUyMi..."></archie-viewer>
  -->

</body>
</html>
