<!doctype html>
<!--
  Recipe 01 — Embed a library from GitHub Pages

  Set src to the published-tree base URL, which contains exhibits.json.
  Replace the sample GitHub Pages URL with your own library URL.
  Cross-origin library reads require CORS permission from the hosting server.
  This example uses the pinned v1.1 CDN bundle.
  See EMBED.md for the reference and README.md for the current local build.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archie viewer — GitHub Pages library</title>
  <style>
    /* Give the viewer a suitable height for this page. */
    body { margin: 0; font-family: system-ui, sans-serif; }
    archie-viewer { display: block; width: 100%; height: 80vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #ddd; }
  </style>

  <!--
    The runtime uses the pinned v1.1 git tag. This snippet has no integrity attribute.
    See EMBED.md for optional SRI and the hash for this release.
  -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/gh/micahchoo/Archie@v1.1/dist/archie-viewer.js"
    crossorigin="anonymous"></script>
</head>

<body>
  <header><h1>Our collection</h1></header>

  <!--
    src = the published-tree base URL (note the trailing slash on the viewer path).
    The viewer opens the library's gallery; click through to any exhibit.
  -->
  <!-- replace with your own published-tree base URL if you fork -->
  <archie-viewer
    src="https://micahchoo.github.io/Archie/viewer/published/"></archie-viewer>
</body>
</html>
