name: Checks

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm typecheck

  # scripts/lib's unit suite (Archie-b975 capture gate: evaluateCaptureGate) — node's built-in test
  # runner over plain node:test/node:assert, no third-party deps. It existed since Archie-b975 but
  # no workflow ever invoked it (Archie-5478); it's its own job, not folded into `test` (which is
  # `pnpm -r test`, workspace packages only — scripts/ isn't a workspace package), and skips
  # pnpm/install entirely (no deps to install) so it stays the fastest job in this file.
  unit-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: scripts/lib unit suite
        run: node --test scripts/lib/*.test.mjs

      # Archie-91e7: every TauriFsBridge method must be granted in the desktop capability manifest.
      # Ungranted commands are denied at RUNTIME in the packaged app only — no unit suite, typecheck
      # or build can see it (fs/tauri.test.ts runs over node:fs, which has no permission system), so
      # this structural check is the only cheap gate for the class. Bare node, no toolchain needed.
      - name: desktop capability manifest covers the fs bridge
        run: node scripts/check-tauri-capabilities.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run every package's test suite
        # Per-package vitest (root vitest binary fails rune tests — never invoke it directly).
        run: pnpm test

  astro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: astro check (apps/viewer)
        run: pnpm --filter @archie/viewer run check

  svelte-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: svelte-check (apps/studio)
        # Studio's .svelte type gate (ISSUES.md Issue 12): tsc --noEmit is blind to .svelte files.
        # Errors fail this job; the ~11 pre-existing a11y WARNINGS do not (no --fail-on-warnings).
        run: pnpm --filter @archie/studio run check

      - name: svelte-check (apps/viewer)
        # The viewer's 23 Svelte islands had NO type gate: `astro check` diagnoses .astro files only
        # (measured 2026-07-20, .claude/rules/svelte-no-typecheck-net.md — a planted undefined
        # identifier in an island passed astro check AND tsc at 0 errors). Baseline was burned to
        # zero the same day (1 real indexing error fixed; 9 intentional initial-capture warnings
        # converted to declared intent via svelte-ignore), so warnings gate too.
        run: pnpm --filter @archie/viewer run check:svelte

  gh-pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio + Viewer (verification only — deploy.yml owns the real deploy build)
        run: bash scripts/build-gh-pages.sh

      # Root bundle ratchet (Archie-9925): scripts/bundle-size.mjs --check against
      # docs/bundle-size.json. Lives HERE because this is the one per-PR job where both app
      # dists already exist (the build step above); the fast unit jobs never build, and the
      # archie-viewer-artifact job ratchets the EMBED bundle — a separate artifact with its
      # own baseline. Growth > max(10%, 10KB) gz over the committed baseline fails; refresh
      # deliberately with `pnpm bundle:baseline` after `pnpm build`.
      - name: App bundle size ratchet
        run: pnpm bundle:check

  # Both gates below were written, documented (ADR-0019 + README's maintainer TIP) and then run by
  # NOTHING — no workflow referenced them until now. They are deliberately scoped to what they
  # actually prove, and neither asserts dist is rebuilt from current source: this repo's cadence is
  # periodic batch catch-up (only 2 of 11 archie-viewer src commits ever carried dist), so a
  # rebuild-and-diff gate would have failed 9 of 11 historical commits. Freshness belongs at the
  # release boundary, not here.
  archie-viewer-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root dist/ is a mirror of packages/archie-viewer/dist/ that exists only so jsDelivr's /gh/
      # serving resolves at the repo root. ADR-0019's amendment warns it "can silently diverge".
      # Reliable in CI specifically because a fresh checkout has no untracked build output —
      # --check diffs working-tree listings, and .gitignore's bare `dist/` hides local strays.
      - name: Root dist/ mirrors the package dist/
        run: pnpm sync-dist:check

      # Size ratchet on the embeddable bundle. Builds to a temp dir, so it does not touch the
      # committed artifact.
      - name: Embed bundle size ratchet
        run: pnpm --filter @render/archie-viewer bundle:check

  # Build the <archie-viewer> bundle from CURRENT SOURCE and drive it in a real browser
  # (recipes/smoke.mjs against the committed published fixture). This is the only gate that runs the
  # BUILT EMBED BUNDLE in a real browser (the e2e job drives Studio's dev server, not the embed):
  # Node's fetch skips the WebIDL receiver brand check, so an unbound-fetch
  # regression passed every unit suite while the built bundle rendered 0 gallery cards
  # (bound-fetch-defaults.md, 2026-07-20). Deliberately NOT a freshness gate — it never diffs the
  # committed dist/ (the repo's cadence is batch catch-up); it asserts source PRODUCES a working
  # bundle. Dirtying the checkout's dist/ is fine: this job commits nothing.
  embed-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build embed bundle from source and smoke it in Chromium
        run: |
          pnpm --filter @render/archie-viewer build
          pnpm sync-dist
          node recipes/smoke.mjs

  # PERF RATCHETS. Both drive BUILT output in a real browser, because both guard failures that are
  # invisible to every unit suite:
  #
  #  - worker-smoke: the DZI and bake workers fall back SILENTLY (sliceToDziAuto catches, bake-async
  #    catches and counts). A worker that dies on import does not break the app — it quietly reverts
  #    to the slow main-thread path while looking healthy, so the measured win simply stops existing.
  #    vitest cannot see this: it has no Worker, and the bench aliases @render/core to a shim, so it
  #    never loads the workers' real import graph (the full barrel calls DOMPurify.addHook() at module
  #    load, in a scope with no document).
  #
  #  - reader payload: the viewer had no equivalent of the embed's bundle:check ratchet, which is
  #    exactly how an exhibit route drifted to 1149 KB (302 KB gz) of eager canvas engine unnoticed
  #    while the embed's own regression was caught. Budgets live in scripts/perf/reader-budget.json.
  #    Raise one only in the commit that legitimately grows the payload; widening it to turn a red run
  #    green is the regression, not the fix.
  perf-ratchets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm exec playwright install --with-deps chromium

      # Both gates read dist/, so build first. Studio's dist carries the workers; the viewer's carries
      # the reader payload.
      - name: Build studio + viewer
        run: |
          pnpm --filter @archie/studio run build
          pnpm --filter @archie/viewer run build

      - name: Shipped workers boot in a browser
        run: node scripts/perf/worker-smoke.mjs

      - name: Reader arrival payload within budget
        run: node scripts/perf/readerrun.mjs --check

  e2e:
    # Browser gates for both apps. Separate job so the unit gates above stay fast; this one pays the
    # browser-download and server-boot cost the others don't need. Both suites bring their own server
    # via Playwright's `webServer`, on dedicated ports, so neither collides with a running `pnpm dev`.
    #
    #  - Studio (Archie-d80f): back/forward navigation over a REAL history — the popstate/hashchange
    #    re-entrancy class is invisible to the repo's pure-module vitest posture. Vite dev on :5198.
    #
    #  - Viewer: the app had no browser gate at all, and three defects shipped past the static ones in
    #    a single session. The sharpest: a prop typed on `$props()` but omitted from the destructuring
    #    beside it, so the arrival chooser's only way back never rendered — measured at 1493 files,
    #    0 errors, 0 warnings from svelte-check with the button broken. Static analysis cannot see
    #    prop WIRING; only driving the app can. Serves BUILT output on :4326, because the static
    #    exhibit shell is emitted at build time and an earlier version silently produced empty object
    #    lists while the build stayed green. All specs run with non-localhost requests aborted, so the
    #    seed's remote IIIF sources can never flake the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Studio navigation e2e
        run: pnpm --filter @archie/studio run e2e

      # `if: always()` so a studio failure doesn't hide the viewer's result — they guard unrelated
      # surfaces and one red should never mask the other's signal.
      - name: Viewer e2e
        if: always()
        run: pnpm --filter @archie/viewer run e2e

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/studio/playwright-report
            apps/viewer/playwright-report
          retention-days: 7
