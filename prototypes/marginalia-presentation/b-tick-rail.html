<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marginalia proto B — Tick rail</title>
<!--
  Archie-f411 throwaway prototype. NOT production code. Open via file://.
  DIRECTION B — Collapsed tick rail (Hypothes.is edge-bucket lineage). The margin is a
  thin rail of TICKS, one per note at its region's on-screen Y. Nothing but marks until you
  engage. Hover / focus a tick and a SINGLE card opens as a popover beside it. Off-screen
  notes gather into top / bottom bucket chips. This is the "keep the image the hero, one
  card at a time" bet: ticks are 1-D points, so they never fight for vertical space the way
  full cards do — overflow and overlap become nudge-apart, not evict.
-->
<style>
  :root {
    --paper:#f4efe4; --ink:#2b2823; --ink-soft:#6d665a; --line:#d8cfbd;
    --card:#fbf8f0; --accent:#c8611f; --tick:#8a7f6a; --sel:#c8611f;
    --font-ui:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#2a2723; color:var(--ink); font-family:var(--font-ui); }
  header { padding:14px 20px; background:#1f1c18; color:#e8e0cf; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:4px 0 0; font-size:12.5px; color:#b3a993; font-family:var(--mono); }
  .bar { display:flex; gap:8px; align-items:center; padding:8px 20px; background:#1f1c18;
    color:#cfc6b2; font-family:var(--mono); font-size:12px; }
  .bar button { font-family:var(--mono); font-size:12px; background:#39332a; color:#e8e0cf;
    border:1px solid #4d4638; border-radius:4px; padding:4px 10px; cursor:pointer; }
  .bar button:hover { background:#463f33; }
  .stage { display:flex; height:calc(100vh - 108px); padding:16px; }
  .canvas { position:relative; flex:1 1 auto; background:var(--paper);
    border-radius:6px 0 0 6px; overflow:hidden; box-shadow:inset 0 0 0 1px #0002; }
  .folio { position:absolute; inset:24px; }
  .textline { position:absolute; left:0; height:7px; border-radius:3px;
    background:repeating-linear-gradient(90deg,#cabfa8 0 22px,#00000000 22px 30px); opacity:.55; }
  .region { position:absolute; border:1.5px solid transparent; border-radius:3px;
    background:#c8611f10; transition:.15s; cursor:pointer; }
  .region.lit { background:#c8611f2b; border-color:#c8611f88; }
  .region.sel { background:#c8611f38; border-color:var(--sel); box-shadow:0 0 0 2px #c8611f33; }
  /* the rail itself */
  .rail { position:relative; flex:0 0 34px; background:#e9e1d1;
    border-radius:0 6px 6px 0; box-shadow:inset 1px 0 0 #0001; }
  .tick { position:absolute; left:8px; height:2px; background:var(--tick); border-radius:2px;
    cursor:pointer; transition:height .12s, background .12s, left .12s, width .12s; }
  .tick:hover { background:var(--ink); }
  .tick.sel { background:var(--sel); height:4px; left:5px; }
  .bucket { position:absolute; left:4px; right:4px; z-index:6; cursor:pointer; text-align:center;
    font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink-soft);
    background:#ddd1b8; border:1px solid var(--line); border-radius:4px; padding:3px 0; }
  .bucket.up { top:6px; } .bucket.down { bottom:6px; }
  .bucket:hover { color:var(--ink); background:#d3c5a6; }
  /* the single on-demand card */
  .pop { position:absolute; width:270px; z-index:20; background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--sel); border-radius:6px;
    padding:11px 13px; box-shadow:0 8px 26px #00000033; }
  .pop .body { font-size:13.5px; line-height:1.45; color:var(--ink); }
  .pop .meta { margin-top:7px; font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); }
  .pop::after { /* connector nub toward the rail */
    content:''; position:absolute; right:-7px; top:16px; width:0; height:0;
    border:7px solid transparent; border-left-color:var(--card); }
  @media (max-width:760px) {
    .stage { flex-direction:column; height:auto; }
    .canvas { border-radius:6px; min-height:52vh; }
    .rail { flex:none; height:30px; width:auto; border-radius:6px; margin-top:12px; }
    .tick { top:auto !important; bottom:8px; left:auto; width:2px !important; height:14px !important; }
    .tick.sel { height:18px !important; }
    /* card becomes a bottom sheet */
    .pop { position:fixed; left:8px; right:8px; bottom:8px; top:auto; width:auto;
      transform:none !important; box-shadow:0 -6px 26px #00000033; }
    .pop::after { display:none; }
    .bucket { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1>Direction B — Collapsed tick rail</h1>
  <p>silent margin of marks · hover/focus opens ONE card · off-screen notes bucket at the edges</p>
</header>
<div class="bar">
  <span>Bet: the canvas stays the hero; the margin is near-invisible until you reach for it.</span>
  <button id="shrink">Shrink height (send notes off-screen → buckets)</button>
  <button id="grow">Reset</button>
</div>
<div class="stage" id="stage">
  <div class="canvas" id="canvas"><div class="folio" id="folio"></div></div>
  <div class="rail" id="rail"></div>
</div>

<script>
const NOTES = [
  { id:'n1', y:0.07, lead:'A later hand added this marginal gloss.', meta:'gloss · 15c hand' },
  { id:'n2', y:0.24, lead:'The scribe abbreviates "quoniam" here; the flourish above the q is the standard tironian mark, not a correction.', meta:'palaeography' },
  { id:'n3', y:0.44, lead:'Overlapping anchor ①. The illustrated root shares its outline with folio 27r — likely the same exemplar.', meta:'botanical · overlap' },
  { id:'n4', y:0.47, lead:'Overlapping anchor ②. Pigment loss.', meta:'condition · overlap' },
  { id:'n5', y:0.70, lead:'The star diagram in this quire recurs three times; each time the outer ring gains a point.', meta:'diagram' },
  { id:'n6', y:0.92, lead:'Binding note: this leaf is a later insert — the gutter stitching does not match the surrounding gathering, and the vellum is a shade lighter.', meta:'codicology' },
];
const TICK_LEN = { short:10, med:15, long:22 }; // width encodes note length
function lenClass(t){ return t.length<50?'short':t.length<110?'med':'long'; }

const folio=document.getElementById('folio'), rail=document.getElementById('rail'), canvas=document.getElementById('canvas');
let selected=null, hover=null;

function buildFolio(){
  folio.innerHTML='';
  for(let i=0;i<26;i++){ const l=document.createElement('div'); l.className='textline';
    l.style.top=(i*3.7+2)+'%'; l.style.width=(60+Math.random()*36)+'%'; folio.appendChild(l); }
  for(const n of NOTES){ const r=document.createElement('div'); r.className='region'; r.dataset.id=n.id;
    r.style.top=(n.y*100-3)+'%'; r.style.left=(8+(n.id.charCodeAt(1)%3)*20)+'%';
    r.style.width='30%'; r.style.height='6%';
    r.addEventListener('click',()=>select(n.id));
    r.addEventListener('pointerenter',()=>setHover(n.id));
    r.addEventListener('pointerleave',()=>setHover(null));
    folio.appendChild(r); }
}

/* 1-D point separation: keep ticks at their anchor but never closer than MINGAP; a pure
   nudge-apart, which is why overlap/overflow are trivial here vs. full cards. */
function placeTicks(anchors){ // [{id,y}] sorted; returns {id->y}
  const MINGAP=8, out={}; let prev=-Infinity;
  for(const a of anchors){ let y=Math.max(a.y, prev+MINGAP); out[a.id]=y; prev=y; }
  return out;
}

function draw(){
  const railBox=rail.getBoundingClientRect();
  const H=railBox.height;
  const regions={}; for(const r of folio.querySelectorAll('.region')){ const b=r.getBoundingClientRect(); regions[r.dataset.id]=(b.top+b.bottom)/2 - railBox.top; }
  const above=[], below=[], inView=[];
  for(const n of NOTES){ const y=regions[n.id];
    if(y<10) above.push(n); else if(y>H-10) below.push(n); else inView.push({id:n.id,y,note:n}); }
  inView.sort((a,b)=>a.y-b.y);
  const ty=placeTicks(inView);

  rail.innerHTML='';
  for(const it of inView){ const n=it.note; const t=document.createElement('div');
    t.className='tick'+(selected===n.id?' sel':''); t.dataset.id=n.id;
    t.style.top=ty[n.id]+'px'; t.style.width=TICK_LEN[lenClass(n.lead)]+'px';
    t.addEventListener('click',()=>select(n.id));
    t.addEventListener('pointerenter',()=>setHover(n.id));
    t.addEventListener('pointerleave',()=>setHover(null));
    rail.appendChild(t); }
  if(above.length){ const b=bucket('up','▲ '+above.length, above[above.length-1].id); rail.appendChild(b); }
  if(below.length){ const b=bucket('down','▼ '+below.length, below[0].id); rail.appendChild(b); }

  for(const r of folio.querySelectorAll('.region')){ r.classList.toggle('sel', r.dataset.id===selected);
    r.classList.toggle('lit', r.dataset.id===hover && r.dataset.id!==selected); }

  // one card only, for the attended tick
  document.querySelectorAll('.pop').forEach(p=>p.remove());
  const attend = hover ?? selected;
  if(attend && attend in ty){
    const n=NOTES.find(x=>x.id===attend);
    const pop=document.createElement('div'); pop.className='pop';
    pop.innerHTML=`<div class="body">${n.lead}</div><div class="meta">${n.meta}</div>`;
    canvas.parentElement.appendChild(pop);
    // position to the LEFT of the rail, vertically centred on the tick, clamped in view
    const stage=document.getElementById('stage').getBoundingClientRect();
    let top = (railBox.top - stage.top) + ty[attend] - 16;
    pop.style.top='0'; const ph=pop.offsetHeight;
    top = Math.max(8, Math.min(top, stage.height-ph-8));
    pop.style.top=top+'px';
    pop.style.left=(railBox.left - stage.left - 270 - 10)+'px';
  }
}
function bucket(dir,label,jumpId){ const b=document.createElement('div'); b.className='bucket '+dir; b.textContent=label;
  b.addEventListener('click',()=>select(jumpId)); return b; }
function setHover(id){ hover=id; draw(); }
function select(id){ selected = selected===id? null : id; draw(); }

document.getElementById('shrink').onclick=()=>{ document.getElementById('stage').style.height='300px'; requestAnimationFrame(draw); };
document.getElementById('grow').onclick=()=>{ document.getElementById('stage').style.height='calc(100vh - 108px)'; requestAnimationFrame(draw); };

buildFolio(); requestAnimationFrame(draw);
window.addEventListener('resize',draw);
</script>
</body>
</html>
