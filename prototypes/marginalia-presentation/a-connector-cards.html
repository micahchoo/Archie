<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marginalia proto A — Connector margin cards</title>
<!--
  Archie-f411 throwaway prototype. NOT production code. Open via file://.
  DIRECTION A — Connector margin cards (Google-Docs / MS-Word comment-margin lineage;
  this is the refined form of the reverted cut D+E). Full note cards live in the right
  margin, each collision-avoidance-stacked beside its region's on-screen Y. A hairline
  connector is drawn from the region to the attended card. Selecting a card pins + expands
  it; neighbours reflow around it. This is the "read every note in place" bet.
-->
<style>
  :root {
    --paper:#f4efe4; --ink:#2b2823; --ink-soft:#6d665a; --line:#d8cfbd;
    --card:#fbf8f0; --accent:#c8611f; --cord:#3f6d86; --sel:#c8611f;
    --font-ui:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#2a2723; color:var(--ink); font-family:var(--font-ui); }
  header { padding:14px 20px; background:#1f1c18; color:#e8e0cf; }
  header h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:.01em; }
  header p { margin:4px 0 0; font-size:12.5px; color:#b3a993; font-family:var(--mono); }
  .stage { display:flex; gap:0; height:calc(100vh - 108px); padding:16px; }
  .canvas { position:relative; flex:1 1 auto; background:var(--paper);
    border-radius:6px 0 0 6px; overflow:hidden; box-shadow:inset 0 0 0 1px #0002; }
  .folio { position:absolute; inset:24px; }
  .textline { position:absolute; left:0; height:7px; border-radius:3px;
    background:repeating-linear-gradient(90deg,#cabfa8 0 22px,#00000000 22px 30px); opacity:.55; }
  .region { position:absolute; border:1.5px solid transparent; border-radius:3px;
    background:#c8611f14; transition:background .15s,border-color .15s; cursor:pointer; }
  .region.lit { background:#c8611f2b; border-color:#c8611f88; }
  .region.sel { background:#c8611f38; border-color:var(--sel); box-shadow:0 0 0 2px #c8611f33; }
  .margin { position:relative; flex:0 0 320px; background:#efe8d9;
    border-radius:0 6px 6px 0; overflow:hidden; box-shadow:inset 1px 0 0 #0001; }
  svg.leaders { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  svg.leaders line { stroke:var(--cord); stroke-width:1.5; opacity:.5; }
  .cards { position:absolute; inset:0; }
  .mcard { position:absolute; left:14px; right:12px; background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--cord); border-radius:5px;
    padding:9px 11px; box-shadow:0 1px 2px #0000001a; cursor:pointer;
    transition:top .13s ease-out, box-shadow .13s; z-index:2; }
  .mcard.sel { border-left-color:var(--sel); box-shadow:0 4px 14px #00000026; z-index:4; }
  .mcard .body { font-size:13.5px; line-height:1.42; color:var(--ink);
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .mcard.sel .body { -webkit-line-clamp:unset; }
  .mcard .meta { margin-top:6px; font-family:var(--mono); font-size:10.5px;
    color:var(--ink-soft); letter-spacing:.02em; }
  .gutter { position:absolute; left:14px; right:12px; z-index:5; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    padding:5px 10px; background:#e3d9c4; border:1px solid var(--line); border-radius:4px;
    color:var(--ink-soft); text-align:center; }
  .gutter.up { top:8px; } .gutter.down { bottom:8px; }
  .gutter:hover { background:#dccfb4; color:var(--ink); }
  .bar { display:flex; gap:8px; align-items:center; padding:8px 20px; background:#1f1c18;
    color:#cfc6b2; font-family:var(--mono); font-size:12px; }
  .bar button { font-family:var(--mono); font-size:12px; background:#39332a; color:#e8e0cf;
    border:1px solid #4d4638; border-radius:4px; padding:4px 10px; cursor:pointer; }
  .bar button:hover { background:#463f33; }
  @media (max-width:760px) {
    .stage { flex-direction:column; height:auto; }
    .canvas { border-radius:6px; min-height:46vh; }
    .margin { flex:none; height:auto; border-radius:6px; margin-top:12px; }
    svg.leaders { display:none; }
    .cards { position:static; }
    .mcard { position:static; left:auto; right:auto; margin:8px; }
    .gutter { position:static; margin:8px; }
    .mcard .body { -webkit-line-clamp:3; }
  }
</style>
</head>
<body>
<header>
  <h1>Direction A — Connector margin cards</h1>
  <p>full cards, stacked beside their region · hairline cord on attention · select = pin + expand</p>
</header>
<div class="bar">
  <span>Bet: read every note in place; position tells you which region it's about.</span>
  <button id="shrink">Shrink column (force overflow)</button>
  <button id="grow">Reset height</button>
</div>
<div class="stage" id="stage">
  <div class="canvas" id="canvas"><div class="folio" id="folio"></div></div>
  <div class="margin" id="margin">
    <svg class="leaders" id="leaders"></svg>
    <div class="cards" id="cards"></div>
  </div>
</div>

<script>
/* ---- fixture: one image region, 6 notes of varying length, TWO overlapping anchors ---- */
const NOTES = [
  { id:'n1', y:0.07, lead:'A later hand added this marginal gloss.', meta:'gloss · 15c hand' },
  { id:'n2', y:0.24, lead:'The scribe abbreviates "quoniam" here; the flourish above the q is the standard tironian mark, not a correction.', meta:'palaeography' },
  { id:'n3', y:0.44, lead:'Overlapping anchor ①. The illustrated root shares its outline with folio 27r — likely the same exemplar.', meta:'botanical · overlap' },
  { id:'n4', y:0.47, lead:'Overlapping anchor ②. Pigment loss.', meta:'condition · overlap' },
  { id:'n5', y:0.70, lead:'The star diagram in this quire recurs three times; each time the outer ring gains a point.', meta:'diagram' },
  { id:'n6', y:0.92, lead:'Binding note: this leaf is a later insert — the gutter stitching does not match the surrounding gathering, and the vellum is a shade lighter.', meta:'codicology' },
];

/* ---- ported layoutMarginalia (render-core/src/geometry/marginalia.ts), JS, +pinId ---- */
function layoutMarginalia(items, opts){
  const minY = opts.minY ?? 0, {viewportH, gap} = opts;
  if (opts.pinId !== undefined){
    const pin = items.find(i=>i.id===opts.pinId);
    if (pin && isFinite(pin.height) && pin.height>=0){
      const anchor = isFinite(pin.anchorY)? Math.min(Math.max(pin.anchorY,minY),viewportH): minY;
      const top = Math.min(Math.max(anchor-pin.height/2,minY), Math.max(viewportH-pin.height,minY));
      const rest = items.filter(i=>i.id!==pin.id);
      const clamp=(i,band)=> !isFinite(i.anchorY)? i
        : band==='up'? {...i, anchorY:Math.min(i.anchorY, Math.max(top-gap,minY))}
        : {...i, anchorY:Math.max(i.anchorY, Math.min(top+pin.height+gap,viewportH))};
      const upItems=rest.filter(i=>isFinite(i.anchorY)&&i.anchorY<=anchor&&i.anchorY>=minY).map(i=>clamp(i,'up'));
      const downItems=rest.filter(i=>!(isFinite(i.anchorY)&&i.anchorY<=anchor&&i.anchorY>=minY)).map(i=>clamp(i,'down'));
      const up=layoutMarginalia(upItems,{viewportH:Math.max(top-gap,minY),gap,minY});
      const down=layoutMarginalia(downItems,{viewportH,gap,minY:Math.min(top+pin.height+gap,viewportH)});
      return {placed:[...up.placed,{id:pin.id,top},...down.placed], above:[...up.above,...down.above], below:[...up.below,...down.below]};
    }
  }
  const above=[],below=[],inView=[];
  for(const it of items){
    if(!isFinite(it.anchorY)||!isFinite(it.height)||it.height<0) below.push(it.id);
    else if(it.anchorY<minY) above.push(it.id);
    else if(it.anchorY>viewportH) below.push(it.id);
    else inView.push(it);
  }
  const sorted=[...inView].sort((a,b)=>a.anchorY-b.anchorY);
  const usable=viewportH-minY; const fits=[]; let stacked=0;
  for(const it of sorted){ const need=it.height+(fits.length?gap:0);
    if(usable<=0||stacked+need>usable){ below.push(it.id); continue; } stacked+=need; fits.push(it); }
  const tops=[];
  for(let i=0;i<fits.length;i++){ const it=fits[i];
    const ideal=Math.min(Math.max(it.anchorY-it.height/2,minY),Math.max(viewportH-it.height,minY));
    const floor=i===0?minY:tops[i-1]+fits[i-1].height+gap; tops.push(Math.max(ideal,floor)); }
  if(fits.length){ const last=fits.length-1; tops[last]=Math.min(tops[last],viewportH-fits[last].height);
    for(let i=last-1;i>=0;i--) tops[i]=Math.min(tops[i],tops[i+1]-gap-fits[i].height); }
  return {placed:fits.map((it,i)=>({id:it.id,top:tops[i]})),above,below};
}

const folio=document.getElementById('folio');
function buildFolio(){
  folio.innerHTML='';
  for(let i=0;i<26;i++){ const l=document.createElement('div'); l.className='textline';
    l.style.top=(i*3.7+2)+'%'; l.style.width=(60+Math.random()*36)+'%'; folio.appendChild(l); }
  for(const n of NOTES){ const r=document.createElement('div'); r.className='region'; r.dataset.id=n.id;
    r.style.top=(n.y*100-3)+'%'; r.style.left=(8+(n.id.charCodeAt(1)%3)*20)+'%';
    r.style.width='30%'; r.style.height='6%';
    r.addEventListener('click',()=>select(n.id));
    r.addEventListener('pointerenter',()=>{ hover=n.id; draw(); });
    r.addEventListener('pointerleave',()=>{ hover=null; draw(); });
    folio.appendChild(r); }
}

let selected=null, hover=null;
const cardsEl=document.getElementById('cards'), leadersEl=document.getElementById('leaders'), marginEl=document.getElementById('margin');
const heights={};

function measureHeights(){
  cardsEl.innerHTML='';
  for(const n of NOTES){ const c=cardEl(n); c.style.visibility='hidden'; c.style.top='0'; cardsEl.appendChild(c); }
  for(const c of cardsEl.children) heights[c.dataset.id]=c.offsetHeight;
}
function cardEl(n){
  const c=document.createElement('div'); c.className='mcard'+(selected===n.id?' sel':''); c.dataset.id=n.id;
  c.innerHTML=`<div class="body">${n.lead}</div><div class="meta">${n.meta}</div>`;
  c.addEventListener('click',()=>select(n.id));
  c.addEventListener('pointerenter',()=>{ hover=n.id; draw(); });
  c.addEventListener('pointerleave',()=>{ hover=null; draw(); });
  return c;
}
function draw(){
  const box=marginEl.getBoundingClientRect();
  const regions={}; for(const r of folio.querySelectorAll('.region')){ const b=r.getBoundingClientRect(); regions[r.dataset.id]={cy:(b.top+b.bottom)/2}; }
  const items=NOTES.map(n=>({id:n.id, anchorY:(regions[n.id].cy)-box.top, height:heights[n.id]||64}));
  const lay=layoutMarginalia(items,{viewportH:box.height, gap:10, minY:8, ...(selected?{pinId:selected}:{})});
  const topOf=Object.fromEntries(lay.placed.map(p=>[p.id,p.top]));

  cardsEl.innerHTML='';
  for(const p of lay.placed){ const n=NOTES.find(x=>x.id===p.id); const c=cardEl(n); c.style.top=p.top+'px'; cardsEl.appendChild(c); }
  marginEl.querySelectorAll('.gutter').forEach(g=>g.remove());
  if(lay.above.length){ marginEl.appendChild(chip('up','↑ '+lay.above.length+' above', lay.above[lay.above.length-1])); }
  if(lay.below.length){ marginEl.appendChild(chip('down','↓ '+lay.below.length+' below', lay.below[0])); }

  for(const r of folio.querySelectorAll('.region')){ r.classList.toggle('sel', r.dataset.id===selected);
    r.classList.toggle('lit', r.dataset.id===hover && r.dataset.id!==selected); }

  leadersEl.innerHTML='';
  const attend = hover ?? selected;
  if(attend && attend in topOf){
    const r=regions[attend]; const cy=topOf[attend]+Math.min(heights[attend]||64,40)/2;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1','0'); line.setAttribute('y1', r.cy-box.top);
    line.setAttribute('x2','14'); line.setAttribute('y2', cy);
    leadersEl.appendChild(line);
  }
}
function chip(dir,label,jumpId){
  const g=document.createElement('div'); g.className='gutter '+dir; g.textContent=label;
  g.addEventListener('click',()=>select(jumpId)); return g;
}
function select(id){ selected = selected===id? null : id; draw(); }

document.getElementById('shrink').onclick=()=>{ document.getElementById('stage').style.height='340px'; requestAnimationFrame(()=>{measureHeights();draw();}); };
document.getElementById('grow').onclick=()=>{ document.getElementById('stage').style.height='calc(100vh - 108px)'; requestAnimationFrame(()=>{measureHeights();draw();}); };

buildFolio(); requestAnimationFrame(()=>{ measureHeights(); draw(); });
window.addEventListener('resize',()=>{ measureHeights(); draw(); });
</script>
</body>
</html>
