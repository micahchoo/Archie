<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marginalia proto C — Density clusters</title>
<!--
  Archie-f411 throwaway prototype. NOT production code. Open via file://.
  DIRECTION C — Density-aware clustering (Medium margin-count-bubble lineage, taken to the
  crowded case). Notes whose regions sit near each other on-screen MERGE into one cluster
  chip showing a count + the top note's first line. A faint heat band on the image marks
  where notes concentrate. Click a chip to expand its stack into a short list; other clusters
  dim. This is the "gracefully survive many overlapping notes, and show WHERE attention
  concentrates" bet — the margin never renders 40 loose cards.
-->
<style>
  :root {
    --paper:#f4efe4; --ink:#2b2823; --ink-soft:#6d665a; --line:#d8cfbd;
    --card:#fbf8f0; --accent:#c8611f; --sel:#c8611f; --heat:#c8611f;
    --font-ui:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#2a2723; color:var(--ink); font-family:var(--font-ui); }
  header { padding:14px 20px; background:#1f1c18; color:#e8e0cf; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:4px 0 0; font-size:12.5px; color:#b3a993; font-family:var(--mono); }
  .bar { display:flex; gap:8px; align-items:center; padding:8px 20px; background:#1f1c18;
    color:#cfc6b2; font-family:var(--mono); font-size:12px; }
  .bar button { font-family:var(--mono); font-size:12px; background:#39332a; color:#e8e0cf;
    border:1px solid #4d4638; border-radius:4px; padding:4px 10px; cursor:pointer; }
  .bar button:hover { background:#463f33; }
  .stage { display:flex; height:calc(100vh - 108px); padding:16px; }
  .canvas { position:relative; flex:1 1 auto; background:var(--paper);
    border-radius:6px 0 0 6px; overflow:hidden; box-shadow:inset 0 0 0 1px #0002; }
  .folio { position:absolute; inset:24px; }
  .textline { position:absolute; left:0; height:7px; border-radius:3px;
    background:repeating-linear-gradient(90deg,#cabfa8 0 22px,#00000000 22px 30px); opacity:.55; }
  .heatband { position:absolute; right:0; width:8px; border-radius:4px; pointer-events:none;
    transition:.15s; }
  .region { position:absolute; border:1.5px solid transparent; border-radius:3px;
    background:#c8611f10; transition:.15s; cursor:pointer; }
  .region.lit { background:#c8611f2b; border-color:#c8611f88; }
  .region.sel { background:#c8611f38; border-color:var(--sel); box-shadow:0 0 0 2px #c8611f33; }
  .margin { position:relative; flex:0 0 300px; background:#efe8d9;
    border-radius:0 6px 6px 0; overflow-y:auto; box-shadow:inset 1px 0 0 #0001; padding:10px; }
  .cluster { margin:0 0 9px; background:var(--card); border:1px solid var(--line);
    border-radius:6px; overflow:hidden; transition:opacity .15s; }
  .cluster.dim { opacity:.4; }
  .cluster.sel { border-color:var(--sel); box-shadow:0 3px 12px #00000022; }
  .chip { display:flex; gap:9px; align-items:flex-start; padding:9px 11px; cursor:pointer; }
  .count { flex:0 0 auto; min-width:22px; height:22px; padding:0 6px; border-radius:11px;
    background:var(--accent); color:#fff; font-family:var(--mono); font-size:12px; font-weight:600;
    display:flex; align-items:center; justify-content:center; }
  .count.one { background:#cfc2a6; color:var(--ink); }
  .chip .lead { font-size:13px; line-height:1.4; color:var(--ink);
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .stack { border-top:1px solid var(--line); }
  .row { padding:9px 11px 9px 42px; border-bottom:1px solid #0000000d; cursor:pointer; }
  .row:last-child { border-bottom:none; }
  .row.sel { background:#c8611f12; }
  .row .body { font-size:13px; line-height:1.42; color:var(--ink); }
  .row .meta { margin-top:5px; font-family:var(--mono); font-size:10px; color:var(--ink-soft); }
  .super { text-align:center; font-family:var(--mono); font-size:11px; color:var(--ink-soft);
    padding:6px; background:#e3d9c4; border:1px dashed var(--line); border-radius:5px; cursor:pointer; }
  @media (max-width:760px) {
    .stage { flex-direction:column; height:auto; }
    .canvas { border-radius:6px; min-height:46vh; }
    .margin { flex:none; border-radius:6px; margin-top:12px; max-height:none; }
    /* clusters become a horizontal chip row over a bottom sheet */
    .clusters-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
    .clusters-row .cluster { flex:0 0 78%; }
  }
</style>
</head>
<body>
<header>
  <h1>Direction C — Density-aware clustering</h1>
  <p>near notes merge into a counted chip · heat band shows concentration · click to expand the stack</p>
</header>
<div class="bar">
  <span>Bet: survive crowding + reveal where attention concentrates; never 40 loose cards.</span>
  <button id="tight">Tighten clustering (merge more)</button>
  <button id="loose">Loosen</button>
</div>
<div class="stage" id="stage">
  <div class="canvas" id="canvas"><div class="folio" id="folio"></div></div>
  <div class="margin" id="margin"></div>
</div>

<script>
const NOTES = [
  { id:'n1', y:0.07, lead:'A later hand added this marginal gloss.', meta:'gloss · 15c hand' },
  { id:'n2', y:0.24, lead:'The scribe abbreviates "quoniam" here; the flourish above the q is the standard tironian mark, not a correction.', meta:'palaeography' },
  { id:'n3', y:0.44, lead:'Overlapping anchor ①. The illustrated root shares its outline with folio 27r — likely the same exemplar.', meta:'botanical · overlap' },
  { id:'n4', y:0.47, lead:'Overlapping anchor ②. Pigment loss along the painted stem.', meta:'condition · overlap' },
  { id:'n5', y:0.70, lead:'The star diagram in this quire recurs three times; each time the outer ring gains a point.', meta:'diagram' },
  { id:'n6', y:0.92, lead:'Binding note: this leaf is a later insert — the gutter stitching does not match the surrounding gathering.', meta:'codicology' },
];

const folio=document.getElementById('folio'), margin=document.getElementById('margin'), canvas=document.getElementById('canvas');
let selected=null, openCluster=null, hover=null;
let THRESH=0.09; // cluster merge distance, as fraction of image height

function buildFolio(){
  folio.innerHTML='';
  for(let i=0;i<26;i++){ const l=document.createElement('div'); l.className='textline';
    l.style.top=(i*3.7+2)+'%'; l.style.width=(60+Math.random()*36)+'%'; folio.appendChild(l); }
  for(const n of NOTES){ const r=document.createElement('div'); r.className='region'; r.dataset.id=n.id;
    r.style.top=(n.y*100-3)+'%'; r.style.left=(8+(n.id.charCodeAt(1)%3)*20)+'%';
    r.style.width='30%'; r.style.height='6%';
    r.addEventListener('click',()=>select(n.id));
    r.addEventListener('pointerenter',()=>{hover=n.id;render();});
    r.addEventListener('pointerleave',()=>{hover=null;render();});
    folio.appendChild(r); }
}

/* single-linkage clustering over anchor Y (image-space fraction) */
function cluster(){
  const sorted=[...NOTES].sort((a,b)=>a.y-b.y);
  const groups=[]; let g=null;
  for(const n of sorted){ if(g && n.y - g.notes[g.notes.length-1].y <= THRESH) g.notes.push(n);
    else { g={notes:[n]}; groups.push(g); } }
  for(const gr of groups){ gr.y=gr.notes.reduce((s,n)=>s+n.y,0)/gr.notes.length; gr.id='c-'+gr.notes[0].id; }
  return groups;
}

function heatColor(count){ const a=Math.min(0.14+count*0.16,0.6); return `rgba(200,97,31,${a})`; }

function render(){
  const groups=cluster();

  // heat bands on the image
  folio.querySelectorAll('.heatband').forEach(b=>b.remove());
  for(const g of groups){ const b=document.createElement('div'); b.className='heatband';
    const span=Math.max(0.05, (g.notes[g.notes.length-1].y - g.notes[0].y)+0.06);
    b.style.top=((g.notes[0].y-0.03)*100)+'%'; b.style.height=(span*100)+'%';
    b.style.background=heatColor(g.notes.length);
    b.style.boxShadow=g.notes.some(n=>n.id===selected)?'0 0 0 1px #c8611f':'none';
    folio.appendChild(b); }

  for(const r of folio.querySelectorAll('.region')){ r.classList.toggle('sel', r.dataset.id===selected);
    r.classList.toggle('lit', r.dataset.id===hover && r.dataset.id!==selected); }

  // margin chips
  margin.innerHTML='';
  // (overflow demo) if more clusters than fit, collapse the tail into a super-cluster chip.
  const MAXVIS=5;
  const visible = groups.length>MAXVIS ? groups.slice(0,MAXVIS-1) : groups;
  const overflow = groups.length>MAXVIS ? groups.slice(MAXVIS-1) : [];

  for(const g of visible){
    const selHere = g.notes.some(n=>n.id===selected);
    const wrap=document.createElement('div');
    wrap.className='cluster'+(selHere?' sel':'')+(openCluster && openCluster!==g.id && !selHere?' dim':'');
    const chip=document.createElement('div'); chip.className='chip';
    chip.innerHTML=`<span class="count ${g.notes.length===1?'one':''}">${g.notes.length}</span>`+
      `<span class="lead">${g.notes[0].lead}</span>`;
    chip.addEventListener('click',()=>{ openCluster = openCluster===g.id?null:g.id;
      if(g.notes.length===1) select(g.notes[0].id); else render(); });
    chip.addEventListener('pointerenter',()=>{ hover=g.notes[0].id; render(); });
    chip.addEventListener('pointerleave',()=>{ hover=null; render(); });
    wrap.appendChild(chip);
    if(openCluster===g.id && g.notes.length>1){
      const stk=document.createElement('div'); stk.className='stack';
      for(const n of g.notes){ const row=document.createElement('div'); row.className='row'+(selected===n.id?' sel':'');
        row.innerHTML=`<div class="body">${n.lead}</div><div class="meta">${n.meta}</div>`;
        row.addEventListener('click',()=>select(n.id)); stk.appendChild(row); }
      wrap.appendChild(stk);
    }
    margin.appendChild(wrap);
  }
  if(overflow.length){ const s=document.createElement('div'); s.className='super';
    const c=overflow.reduce((n,g)=>n+g.notes.length,0);
    s.textContent=`+ ${overflow.length} more clusters (${c} notes) — zoom the image to separate them`;
    s.addEventListener('click',()=>{ THRESH=Math.max(0.02,THRESH-0.03); render(); });
    margin.appendChild(s); }
}
function select(id){ selected = selected===id? null : id;
  // open the containing cluster so the selected note is visible
  const g=cluster().find(gr=>gr.notes.some(n=>n.id===id));
  if(selected && g && g.notes.length>1) openCluster=g.id;
  render();
}

document.getElementById('tight').onclick=()=>{ THRESH=Math.min(0.4,THRESH+0.05); render(); };
document.getElementById('loose').onclick=()=>{ THRESH=Math.max(0.01,THRESH-0.03); render(); };

buildFolio(); render();
window.addEventListener('resize',render);
</script>
</body>
</html>
